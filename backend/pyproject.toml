[project]
name = "placar-backend"
version = "0.1.0"
description = "Placar Parlamentar backend (Django)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.1,<6.2",
    "httpx>=0.28,<0.29",
    "psycopg[binary]>=3.3,<3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<9.3",
    "pytest-django>=4.14,<4.15",
    "pytest-socket>=0.8,<0.9",
    "respx>=0.23,<0.24",
    "coverage>=7.17,<7.18",
    "ruff>=0.17,<0.18",
    "pip-audit>=2.10,<2.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
pythonpath = ["."]
# Tests never reach the network; only the local database is allowed (decision 0011).
addopts = "--disable-socket --allow-hosts=127.0.0.1,localhost --strict-markers"

[tool.coverage.run]
source = ["placar"]
branch = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# S = security rules (decision 0012).
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
