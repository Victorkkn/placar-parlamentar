# Local PostgreSQL only (decisions 0006 and 0013). Values come from the git-ignored .env.
# Removing the volume deletes data and needs the owner's approval (decision 0002).
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?set DATABASE_NAME in .env}
      POSTGRES_USER: ${DATABASE_USER:?set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - placar_pgdata:/var/lib/postgresql

volumes:
  placar_pgdata:
